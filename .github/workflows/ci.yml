name: CI

# Third-party actions are pinned to major versions; Dependabot (github-actions) can be configured
# to pin them to commit SHAs if stricter supply-chain hygiene is wanted.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the Playwright E2E job
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_e2e:
        description: Run the Playwright E2E job
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # If the openapi.yml test fails, regenerate: cargo run -q -- openapi --format yaml > openapi.yml
      - run: cargo test --all-targets --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: web/dist must be committed and up to date
        working-directory: .
        run: |
          git diff --exit-code -- web/dist || { echo "web/dist is stale: commit the rebuilt files" >&2; exit 1; }
          [ -z "$(git ls-files --others --exclude-standard web/dist)" ] || { echo "web/dist has untracked files" >&2; exit 1; }

  e2e:
    needs: [rust, web]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.run_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: scripts/e2e.sh
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: web/e2e/test-results/
          if-no-files-found: ignore
