[package]
name = "telegram-message-archive"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lib]
name = "telegram_message_archive"
path = "src/lib.rs"

[[bin]]
name = "telegram-message-archive"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
