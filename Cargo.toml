[package]
name = "tgarchive"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lib]
name = "tgarchive"
path = "src/lib.rs"

[[bin]]
name = "tgarchive"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rpassword = "7.5.4"
dotenvy = "0.15"
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "yaml"] }
tower-http = { version = "0.6", features = ["request-id", "trace", "limit", "timeout", "cors"] }
grammers-client = { version = "=0.10.0", default-features = false }
grammers-session = { version = "=0.10.0", default-features = false, features = ["serde"] }
# Grammers crypto 0.10 expects the rc0 bigint/check API; rc1 is incompatible.
glass_pumpkin = "=2.0.0-rc0"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
serde_norway = "0.9"
tokio = { version = "1.53", features = ["test-util"] }

[patch.crates-io]
# Expose the processed update-buffer boundary for archive-before-checkpoint ordering.
grammers-client = { path = "vendor/grammers-client" }
