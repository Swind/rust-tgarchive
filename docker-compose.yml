# Usage:
#   mkdir -p data
#   docker compose run --rm tgarchive auth login    # first time only (interactive)
#   docker compose up -d
# .env (see README) provides TELEGRAM_API_ID / TELEGRAM_API_HASH.
services:
  tgarchive:
    image: ghcr.io/swind/rust-tgarchive:0.1.2
    user: "${TGARCHIVE_UID:-1000}:${TGARCHIVE_GID:-1000}"
    env_file: .env
    environment:
      # the paths below live in ./data; .env must not override them
      DATABASE_URL: sqlite:///data/telegram.db
      TELEGRAM_SESSION_FILE: /data/telegram.session
    ports:
      # The REST API has no authentication: loopback by default.
      - "${TGARCHIVE_BIND_IP:-127.0.0.1}:8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 60s
