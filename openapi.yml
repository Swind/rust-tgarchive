openapi: 3.1.0
info:
  title: tgarchive
  description: ''
  license:
    name: ''
  version: 0.1.0
paths:
  /api/v1/chats:
    get:
      tags:
      - routes
      operationId: list_chats
      parameters:
      - name: tracked
        in: query
        description: Only return tracked (collected) chats.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/refresh:
    post:
      tags:
      - routes
      operationId: refresh_chats
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}:
    get:
      tags:
      - routes
      operationId: get_chat
      parameters:
      - name: chat_id
        in: path
        description: Marked Telegram chat ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/messages:
    get:
      tags:
      - routes
      operationId: list_chat_messages
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: chat_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: sender_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: before
        in: query
        required: false
        schema:
          type: string
      - name: after
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/messages/{message_id}:
    get:
      tags:
      - routes
      operationId: get_message
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: message_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/sync:
    post:
      tags:
      - routes
      operationId: sync_chat
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Chat is not tracked (code chat_not_tracked) or a conflicting job is active (code conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/tracking:
    put:
      tags:
      - routes
      operationId: track_chat
      parameters:
      - name: chat_id
        in: path
        description: Marked Telegram chat ID
        required: true
        schema:
          type: integer
          format: int64
      - name: backfill
        in: query
        description: Also enqueue a history sync for the chat (needs the running collector). Reuses an active job instead of duplicating it.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Chat is now tracked (idempotent); with backfill=true also carries the history sync job id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackChatDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Storage unavailable, or backfill requested without a running collector / with a full queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags:
      - routes
      operationId: untrack_chat
      parameters:
      - name: chat_id
        in: path
        description: Marked Telegram chat ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Chat is no longer tracked; stored messages are kept (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/messages:
    get:
      tags:
      - routes
      operationId: list_messages
      parameters:
      - name: chat_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: sender_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: before
        in: query
        required: false
        schema:
          type: string
      - name: after
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/messages/search:
    get:
      tags:
      - routes
      operationId: search_messages
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: chat_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: sender_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: before
        in: query
        required: false
        schema:
          type: string
      - name: after
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/status:
    get:
      tags:
      - routes
      operationId: status
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sync:
    post:
      tags:
      - routes
      operationId: sync_all
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sync/jobs/{job_id}:
    get:
      tags:
      - routes
      operationId: get_sync_job
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sync/status:
    get:
      tags:
      - routes
      operationId: sync_status
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /health/live:
    get:
      tags:
      - routes
      operationId: live
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
  /health/ready:
    get:
      tags:
      - routes
      operationId: ready
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
  /openapi.json:
    get:
      tags: []
      operationId: json_endpoint
      responses:
        '200':
          description: OpenAPI JSON document
          content:
            application/json: {}
  /openapi.yml:
    get:
      tags: []
      operationId: yaml_endpoint
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml: {}
components:
  schemas:
    AttachmentDto:
      type: object
      required:
      - kind
      properties:
        file_name:
          type:
          - string
          - 'null'
        kind:
          $ref: '#/components/schemas/AttachmentKindDto'
        mime_type:
          type:
          - string
          - 'null'
        size:
          type:
          - integer
          - 'null'
          format: int64
        telegram_file_id:
          type:
          - string
          - 'null'
    AttachmentKindDto:
      type: string
      enum:
      - photo
      - video
      - audio
      - voice
      - document
      - sticker
      - animation
      - other
    ChatDto:
      type: object
      required:
      - id
      - kind
      - tracked
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/ChatKindDto'
        title:
          type:
          - string
          - 'null'
        tracked:
          type: boolean
          description: Whether the chat is opted in for collection.
        username:
          type:
          - string
          - 'null'
    ChatKindDto:
      type: string
      enum:
      - private
      - group
      - supergroup
      - channel
    ComponentStatusDto:
      type: object
      required:
      - state
      properties:
        detail:
          type:
          - string
          - 'null'
        state:
          type: string
    ErrorDetail:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    HealthDto:
      type: object
      required:
      - status
      properties:
        status:
          type: string
    MessageDto:
      type: object
      required:
      - id
      - chat_id
      - timestamp
      - collected_at
      - attachments
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentDto'
        chat_id:
          type: integer
          format: int64
        collected_at:
          type: string
          format: date-time
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: integer
          format: int64
        reply_to:
          type:
          - integer
          - 'null'
          format: int64
        sender_id:
          type:
          - integer
          - 'null'
          format: int64
        text:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
    MessagePageDto:
      type: object
      required:
      - items
      - has_more
      properties:
        has_more:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageDto'
        next_cursor:
          type:
          - string
          - 'null'
    RateLimitDto:
      type: object
      required:
      - interval_ms
      - base_interval_ms
      properties:
        base_interval_ms:
          type: integer
          format: int64
          description: Configured base interval (`SYNC_PAGE_DELAY_MS`).
          minimum: 0
        interval_ms:
          type: integer
          format: int64
          description: Current minimum interval between history requests (grows after FLOOD_WAIT).
          minimum: 0
        last_flood_at:
          type:
          - string
          - 'null'
          format: date-time
        last_flood_wait_secs:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    StatusDto:
      type: object
      required:
      - collector
      - sync_jobs
      - unresolved_deletions
      properties:
        collector:
          $ref: '#/components/schemas/ComponentStatusDto'
        rate_limit:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RateLimitDto'
            description: Pacing of Telegram history requests; absent when this process has no Telegram access.
        sync_jobs:
          type: array
          items:
            $ref: '#/components/schemas/SyncJobDto'
        unresolved_deletions:
          type: integer
          format: int64
          description: Deletions that could not be attributed to a chat (kept as tombstones).
          minimum: 0
    SyncJobDto:
      type: object
      required:
      - id
      - scope
      - state
      - created_at
      - has_error
      properties:
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        has_error:
          type: boolean
        id:
          type: string
        scope:
          type: string
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: string
    TrackChatDto:
      allOf:
      - $ref: '#/components/schemas/ChatDto'
      - type: object
        properties:
          backfill:
            type:
            - string
            - 'null'
            description: '`queued` for a newly enqueued job, `already_running` when an existing job was reused.'
          backfill_job_id:
            type:
            - string
            - 'null'
            description: History sync job covering this chat (only with `backfill=true`).
      description: 'Response of `PUT /chats/{id}/tracking`: the chat, plus backfill info when requested.'
tags:
- name: archive
  description: Local Telegram archive queries

