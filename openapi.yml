openapi: 3.1.0
info:
  title: tgarchive
  description: ''
  license:
    name: ''
  version: 0.1.3
paths:
  /api/v1/chats:
    get:
      tags:
      - routes
      operationId: list_chats
      parameters:
      - name: tracked
        in: query
        description: Only return tracked (collected) chats.
        required: false
        schema:
          type: boolean
      - name: sort
        in: query
        description: Sort order; default is by chat ID.
        required: false
        schema:
          $ref: '#/components/schemas/ChatSortDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/refresh:
    post:
      tags:
      - routes
      operationId: refresh_chats
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}:
    get:
      tags:
      - routes
      operationId: get_chat
      parameters:
      - name: chat_id
        in: path
        description: Marked Telegram chat ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/media-policy:
    get:
      tags:
      - routes
      operationId: get_media_policy
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPolicyDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags:
      - routes
      operationId: set_media_policy
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPolicyDto'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPolicyDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/media/downloads:
    post:
      tags:
      - routes
      operationId: backfill_media
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaDownloadDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/messages:
    get:
      tags:
      - routes
      operationId: list_chat_messages
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: chat_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: sender_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: post_author
        in: query
        description: Exact channel post signature.
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: before
        in: query
        required: false
        schema:
          type: string
      - name: after
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: include_deleted
        in: query
        description: Also return deleted messages (flagged with `is_deleted`/`deleted_at`).
        required: false
        schema:
          type: boolean
      - name: exclude_bots
        in: query
        description: Hide messages from known bots (`senders.is_bot=1`); unknown senders are kept.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/messages/{message_id}:
    get:
      tags:
      - routes
      operationId: get_message
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: message_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: include_deleted
        in: query
        description: Also return the message if it was deleted.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/messages/{message_id}/context:
    get:
      tags:
      - routes
      operationId: message_context
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: message_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: before
        in: query
        description: Messages older than the anchor (0-100, default 20).
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: after
        in: query
        description: Messages newer than the anchor (0-100, default 20).
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageContextDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Anchor message not found (or deleted without include_deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/messages/{message_id}/media:
    get:
      tags:
      - routes
      operationId: message_media
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: message_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaDownloadDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/senders:
    get:
      tags:
      - routes
      operationId: list_chat_senders
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Maximum senders returned (1-1000, default 100).
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: Senders with non-deleted messages in the chat, most messages first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SenderSummaryDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/sync:
    post:
      tags:
      - routes
      operationId: sync_chat
      parameters:
      - name: chat_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: refetch
        in: query
        description: |-
          Re-download the whole history and backfill NULL sender/post-author/forward/attachment
          metadata of archived messages (text, versions and deletions are untouched). Resumable.
        required: false
        schema:
          type: boolean
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Chat is not tracked (code chat_not_tracked) or a conflicting job is active (code conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/chats/{chat_id}/tracking:
    put:
      tags:
      - routes
      operationId: track_chat
      parameters:
      - name: chat_id
        in: path
        description: Marked Telegram chat ID
        required: true
        schema:
          type: integer
          format: int64
      - name: backfill
        in: query
        description: Also enqueue a history sync for the chat (needs the running collector). Reuses an active job instead of duplicating it.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Chat is now tracked (idempotent); with backfill=true also carries the history sync job id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackChatDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Storage unavailable, or backfill requested without a running collector / with a full queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags:
      - routes
      operationId: untrack_chat
      parameters:
      - name: chat_id
        in: path
        description: Marked Telegram chat ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Chat is no longer tracked; stored messages are kept (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/media/{media_id}:
    get:
      tags:
      - routes
      operationId: get_media
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDownloadDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/media/{media_id}/archive:
    post:
      tags:
      - routes
      operationId: archive_media
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDownloadDto'
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDownloadDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/media/{media_id}/content:
    get:
      tags:
      - routes
      operationId: media_content
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Verified local image bytes
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/media/{media_id}/retry:
    post:
      tags:
      - routes
      operationId: retry_media
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDownloadDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/messages:
    get:
      tags:
      - routes
      operationId: list_messages
      parameters:
      - name: chat_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: sender_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: post_author
        in: query
        description: Exact channel post signature.
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: before
        in: query
        required: false
        schema:
          type: string
      - name: after
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: include_deleted
        in: query
        description: Also return deleted messages (flagged with `is_deleted`/`deleted_at`).
        required: false
        schema:
          type: boolean
      - name: exclude_bots
        in: query
        description: Hide messages from known bots (`senders.is_bot=1`); unknown senders are kept.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/messages/search:
    get:
      tags:
      - routes
      operationId: search_messages
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: chat_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: sender_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: post_author
        in: query
        description: Exact channel post signature.
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: before
        in: query
        description: Cursor from the previous page's `next_cursor`.
        required: false
        schema:
          type: string
      - name: after
        in: query
        description: 'Only with `sort=time`: cursor for the newer direction.'
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: include_deleted
        in: query
        description: Also return deleted messages (flagged with `is_deleted`/`deleted_at`).
        required: false
        schema:
          type: boolean
      - name: exclude_bots
        in: query
        description: Hide messages from known bots (`senders.is_bot=1`); unknown senders are kept.
        required: false
        schema:
          type: boolean
      - name: sort
        in: query
        description: Result order; default `relevance`.
        required: false
        schema:
          $ref: '#/components/schemas/SearchSortDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePageDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/senders:
    get:
      tags:
      - routes
      operationId: list_senders
      parameters:
      - name: q
        in: query
        description: |-
          Substring of display name or username (NFKC + case-insensitive, Chinese substrings work),
          `@username` (exact) or a numeric sender ID.
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Order; default `messages`.
        required: false
        schema:
          $ref: '#/components/schemas/SenderSortDto'
      - name: limit
        in: query
        description: Page size (1-1000, default 100).
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: cursor
        in: query
        description: Cursor from the previous page's `next_cursor`.
        required: false
        schema:
          type: string
      - name: include_deleted
        in: query
        description: Count deleted messages too.
        required: false
        schema:
          type: boolean
      - name: is_bot
        in: query
        description: '`true` = only bots, `false` = only non-bots (unknown included); omitted = everyone.'
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Senders with message counts, chat counts and activity range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderPageDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/senders/{sender_id}:
    get:
      tags:
      - routes
      operationId: get_sender
      parameters:
      - name: sender_id
        in: path
        description: Marked sender ID
        required: true
        schema:
          type: integer
          format: int64
      - name: include_deleted
        in: query
        description: Count deleted messages too.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Sender with per-chat breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderDetailDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/status:
    get:
      tags:
      - routes
      operationId: status
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sync:
    post:
      tags:
      - routes
      operationId: sync_all
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sync/jobs/{job_id}:
    get:
      tags:
      - routes
      operationId: get_sync_job
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job with per-chat progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/sync/status:
    get:
      tags:
      - routes
      operationId: sync_status
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /health/live:
    get:
      tags:
      - routes
      operationId: live
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
  /health/ready:
    get:
      tags:
      - routes
      operationId: ready
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
        '503':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
  /openapi.json:
    get:
      tags: []
      operationId: json_endpoint
      responses:
        '200':
          description: OpenAPI JSON document
          content:
            application/json: {}
  /openapi.yml:
    get:
      tags: []
      operationId: yaml_endpoint
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml: {}
components:
  schemas:
    AttachmentDto:
      type: object
      required:
      - kind
      properties:
        file_name:
          type:
          - string
          - 'null'
        kind:
          $ref: '#/components/schemas/AttachmentKindDto'
        mime_type:
          type:
          - string
          - 'null'
        size:
          type:
          - integer
          - 'null'
          format: int64
        telegram_file_id:
          type:
          - string
          - 'null'
    AttachmentKindDto:
      type: string
      enum:
      - photo
      - video
      - audio
      - voice
      - document
      - sticker
      - animation
      - other
    ChatDto:
      type: object
      required:
      - id
      - kind
      - tracked
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/ChatKindDto'
        stats:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChatStatsDto'
            description: Aggregate archive/sync stats; omitted by `POST /chats/refresh`.
        title:
          type:
          - string
          - 'null'
        tracked:
          type: boolean
          description: Whether the chat is opted in for collection.
        username:
          type:
          - string
          - 'null'
    ChatKindDto:
      type: string
      enum:
      - private
      - group
      - supergroup
      - channel
    ChatSortDto:
      type: string
      description: Sort order of `GET /chats`.
      enum:
      - title
      - last_message
      - message_count
    ChatStatsDto:
      type: object
      required:
      - message_count
      - deleted_count
      - history_complete
      properties:
        deleted_count:
          type: integer
          format: int64
          minimum: 0
        first_message_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamps of the oldest / newest non-deleted message.
        history_complete:
          type: boolean
          description: Whether history backfill reached the start of the chat.
        last_error:
          type:
          - string
          - 'null'
          description: Sanitized reason of the last failed sync, cleared by the next successful checkpoint.
        last_message_at:
          type:
          - string
          - 'null'
          format: date-time
        last_sync_completed_at:
          type:
          - string
          - 'null'
          format: date-time
        message_count:
          type: integer
          format: int64
          description: Non-deleted archived messages.
          minimum: 0
    ComponentStatusDto:
      type: object
      required:
      - state
      properties:
        detail:
          type:
          - string
          - 'null'
        state:
          type: string
    ErrorDetail:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ForwardDto:
      type: object
      properties:
        date:
          type:
          - string
          - 'null'
          format: date-time
          description: When the original message was sent.
        from_id:
          type:
          - integer
          - 'null'
          format: int64
          description: Original author or channel (marked ID) when Telegram exposes it.
        from_name:
          type:
          - string
          - 'null'
          description: Name of the original author (also set for users who hide their account).
    HealthDto:
      type: object
      required:
      - status
      properties:
        status:
          type: string
    MediaDownloadDto:
      type: object
      required:
      - id
      - ordinal
      - variant
      - state
      properties:
        byte_size:
          type:
          - integer
          - 'null'
          format: int64
        content_url:
          type:
          - string
          - 'null'
        height:
          type:
          - integer
          - 'null'
          format: int32
        id:
          type: integer
          format: int64
        last_error:
          type:
          - string
          - 'null'
        next_attempt_at:
          type:
          - integer
          - 'null'
          format: int64
        ordinal:
          type: integer
          format: int64
        state:
          type: string
        variant:
          type: string
        width:
          type:
          - integer
          - 'null'
          format: int32
    MediaPolicyDto:
      type: object
      required:
      - auto_archive
      properties:
        auto_archive:
          type: boolean
    MessageContextDto:
      type: object
      description: Messages around an anchor, both lists oldest first.
      required:
      - anchor
      - before
      - after
      - has_more_before
      - has_more_after
      properties:
        after:
          type: array
          items:
            $ref: '#/components/schemas/MessageDto'
        after_cursor:
          type:
          - string
          - 'null'
          description: Pass as `after` to `GET .../messages` to keep scrolling to newer messages.
        anchor:
          $ref: '#/components/schemas/MessageDto'
        before:
          type: array
          items:
            $ref: '#/components/schemas/MessageDto'
        before_cursor:
          type:
          - string
          - 'null'
          description: Pass as `before` to `GET .../messages` to keep scrolling to older messages.
        has_more_after:
          type: boolean
        has_more_before:
          type: boolean
    MessageDto:
      type: object
      required:
      - id
      - chat_id
      - timestamp
      - collected_at
      - attachments
      - is_deleted
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentDto'
        chat_id:
          type: integer
          format: int64
        collected_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Set when the message was deleted on Telegram (only returned with `include_deleted=true`).
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
        forward:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ForwardDto'
            description: Origin of a forwarded message; null when the message was not forwarded.
        id:
          type: integer
          format: int64
        is_deleted:
          type: boolean
        post_author:
          type:
          - string
          - 'null'
          description: Channel post signature (`post_author`); not the sender.
        reply_to:
          type:
          - integer
          - 'null'
          format: int64
        sender:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SenderDto'
            description: Resolved sender; null for messages without a sender.
        sender_id:
          type:
          - integer
          - 'null'
          format: int64
        snippet:
          type:
          - string
          - 'null'
          description: |-
            Search results only: excerpt (about 120 characters) around the first match, `null` when
            no match position could be determined. `text` always carries the full message.
        text:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
    MessagePageDto:
      type: object
      required:
      - items
      - has_more
      properties:
        has_more:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageDto'
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor; pass it back as `before` to get the next page.
    RateLimitDto:
      type: object
      required:
      - interval_ms
      - base_interval_ms
      properties:
        base_interval_ms:
          type: integer
          format: int64
          description: Configured base interval (`SYNC_PAGE_DELAY_MS`).
          minimum: 0
        interval_ms:
          type: integer
          format: int64
          description: Current minimum interval between history requests (grows after FLOOD_WAIT).
          minimum: 0
        last_flood_at:
          type:
          - string
          - 'null'
          format: date-time
        last_flood_wait_secs:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    SearchIndexDto:
      type: object
      required:
      - version
      - state
      - indexed
      - total
      properties:
        indexed:
          type: integer
          format: int64
          description: Messages in the index.
          minimum: 0
        state:
          type: string
          description: |-
            `ready`; `rebuilding` or `stale` (search then uses a slower substring scan until
            `tgarchive search rebuild-index` / `db init` completes).
        total:
          type: integer
          format: int64
          description: Messages with text that belong in the index.
          minimum: 0
        version:
          type: integer
          format: int32
          description: Index format version stored in the database (0 = never built).
          minimum: 0
    SearchSortDto:
      type: string
      description: Result order of `GET /messages/search`.
      enum:
      - relevance
      - time
    SenderChatDto:
      type: object
      required:
      - chat_id
      - kind
      - message_count
      properties:
        chat_id:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/ChatKindDto'
        last_message_at:
          type:
          - string
          - 'null'
          format: date-time
        message_count:
          type: integer
          format: int64
          minimum: 0
        title:
          type:
          - string
          - 'null'
    SenderDetailDto:
      type: object
      description: A sender plus its per-chat breakdown (most messages first).
      required:
      - id
      - kind
      - message_count
      - chat_count
      - is_self
      - chats
      - name_history
      properties:
        chat_count:
          type: integer
          format: int64
          minimum: 0
        chats:
          type: array
          items:
            $ref: '#/components/schemas/SenderChatDto'
        display_name:
          type:
          - string
          - 'null'
        first_message_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: integer
          format: int64
        is_bot:
          type:
          - boolean
          - 'null'
        is_self:
          type: boolean
        kind:
          $ref: '#/components/schemas/SenderKindDto'
        last_message_at:
          type:
          - string
          - 'null'
          format: date-time
        message_count:
          type: integer
          format: int64
          minimum: 0
        name_history:
          type: array
          items:
            $ref: '#/components/schemas/SenderNameHistoryDto'
          description: Observed names, newest observation first.
        username:
          type:
          - string
          - 'null'
    SenderDto:
      type: object
      required:
      - id
      - is_self
      properties:
        display_name:
          type:
          - string
          - 'null'
          description: Profile name; for a chat/channel posting as itself, the chat title.
        id:
          type: integer
          format: int64
        is_bot:
          type:
          - boolean
          - 'null'
          description: Telegram's bot flag; null = unknown or not a user.
        is_self:
          type: boolean
          description: True when the sender is the bound Telegram account.
        username:
          type:
          - string
          - 'null'
    SenderKindDto:
      type: string
      enum:
      - user
      - chat
      - channel
      - unknown
    SenderNameDto:
      type: object
      description: A historical display name / username combination.
      properties:
        display_name:
          type:
          - string
          - 'null'
        username:
          type:
          - string
          - 'null'
    SenderNameHistoryDto:
      type: object
      description: |-
        Names tgarchive observed for a sender. Timestamps are when tgarchive saw the names, not when
        the user changed them.
      required:
      - first_seen_at
      - last_seen_at
      properties:
        display_name:
          type:
          - string
          - 'null'
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        username:
          type:
          - string
          - 'null'
    SenderPageDto:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SenderProfileDto'
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor; pass it back as `cursor` to get the next page.
    SenderProfileDto:
      type: object
      description: A sender with archive-wide aggregates.
      required:
      - id
      - kind
      - matched_history
      - message_count
      - chat_count
      - is_self
      properties:
        chat_count:
          type: integer
          format: int64
          description: Chats in which the sender has messages.
          minimum: 0
        display_name:
          type:
          - string
          - 'null'
          description: Profile name; for a channel posting as itself, the channel title.
        first_message_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: integer
          format: int64
        is_bot:
          type:
          - boolean
          - 'null'
          description: Telegram's bot flag; null = unknown or not a user.
        is_self:
          type: boolean
          description: The Telegram account this archive is bound to.
        kind:
          $ref: '#/components/schemas/SenderKindDto'
        last_message_at:
          type:
          - string
          - 'null'
          format: date-time
        matched_history:
          type: boolean
          description: True when a text query matched only a historical name (see `matched_name`).
        matched_name:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SenderNameDto'
            description: The old display name/username that matched the query; null unless `matched_history`.
        message_count:
          type: integer
          format: int64
          description: Messages by this sender (deleted ones only with `include_deleted=true`).
          minimum: 0
        username:
          type:
          - string
          - 'null'
    SenderSortDto:
      type: string
      description: Sort order of `GET /senders`.
      enum:
      - messages
      - last_message
      - name
    SenderSummaryDto:
      type: object
      required:
      - id
      - message_count
      properties:
        display_name:
          type:
          - string
          - 'null'
        id:
          type: integer
          format: int64
        is_bot:
          type:
          - boolean
          - 'null'
        message_count:
          type: integer
          format: int64
          description: Non-deleted messages by this sender in the chat.
          minimum: 0
        username:
          type:
          - string
          - 'null'
    StatusDto:
      type: object
      required:
      - collector
      - sync_jobs
      - unresolved_deletions
      - search_index
      properties:
        collector:
          $ref: '#/components/schemas/ComponentStatusDto'
        rate_limit:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RateLimitDto'
            description: Pacing of Telegram history requests; absent when this process has no Telegram access.
        search_index:
          $ref: '#/components/schemas/SearchIndexDto'
          description: Full-text search index state.
        sync_jobs:
          type: array
          items:
            $ref: '#/components/schemas/SyncJobDto'
        unresolved_deletions:
          type: integer
          format: int64
          description: Deletions that could not be attributed to a chat (kept as tombstones).
          minimum: 0
    SyncJobChatDto:
      type: object
      required:
      - chat_id
      - state
      - committed_count
      properties:
        chat_id:
          type: integer
          format: int64
        committed_count:
          type: integer
          format: int64
          minimum: 0
        error_summary:
          type:
          - string
          - 'null'
        state:
          type: string
        title:
          type:
          - string
          - 'null'
    SyncJobDto:
      type: object
      required:
      - id
      - scope
      - state
      - created_at
      - has_error
      properties:
        chats:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SyncJobChatDto'
          description: Per-chat progress; only present on `GET /sync/jobs/{id}`.
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        error_summary:
          type:
          - string
          - 'null'
          description: Sanitized single-line failure reason (at most 300 chars; never message text).
        has_error:
          type: boolean
        id:
          type: string
        retry_after_secs:
          type:
          - integer
          - 'null'
          format: int64
          description: Seconds Telegram asked to wait, for `rate_limited` jobs.
          minimum: 0
        scope:
          type: string
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: string
    TrackChatDto:
      allOf:
      - $ref: '#/components/schemas/ChatDto'
      - type: object
        properties:
          backfill:
            type:
            - string
            - 'null'
            description: '`queued` for a newly enqueued job, `already_running` when an existing job was reused.'
          backfill_job_id:
            type:
            - string
            - 'null'
            description: History sync job covering this chat (only with `backfill=true`).
      description: 'Response of `PUT /chats/{id}/tracking`: the chat, plus backfill info when requested.'
tags:
- name: archive
  description: Local Telegram archive queries

